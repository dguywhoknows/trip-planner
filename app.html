<!doctype html>
<html lang="en" data-gate="app">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Mapper</title>
<meta name="description" content="AI travel itineraries on a live map: route optimization, walking times, budget breakdown, location fixing and GPX / calendar export.">
<meta name="app-repo" content="https://github.com/dguywhoknows/trip-planner">
<meta name="app-version" content="2.0.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Arial%2CHelvetica%2Csans-serif' font-weight='700' font-size='13' fill='white'%3ETM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/app.css">
<script src="src/lib/config.js"></script>
<script src="src/lib/auth.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><a class="logo-link" href="index.html" aria-label="Home page"><span class="logo" aria-hidden="true">TM</span></a><div><h1>Trip Mapper</h1><p>Plan it, map it, walk it.</p></div></div>
  <nav class="topnav" data-nav aria-label="Pages"></nav>
  <div class="top-actions"><a class="btn ghost sm" href="https://github.com/dguywhoknows/trip-planner" target="_blank" rel="noopener">GitHub</a><span data-ai-badge></span></div>
</header>
<div class="page active" data-page="planner" data-title="Planner">
<div class="toolbar">
  <input class="input" id="dest" value="Lisbon, Portugal" aria-label="Destination">
  <select id="days" style="width:auto"><option value="1">1 day</option><option value="2" selected>2 days</option><option value="3">3 days</option><option value="4">4 days</option><option value="5">5 days</option></select>
  <select id="pace" style="width:auto"><option value="relaxed">Relaxed</option><option value="balanced" selected>Balanced</option><option value="packed">Packed</option></select>
  <select id="budget" style="width:auto"><option value="budget">Budget</option><option value="mid" selected>Mid-range</option><option value="lux">Splurge</option></select>
  <input class="input" id="interests" value="food, viewpoints, history" aria-label="Interests" style="max-width:220px">
  <input class="input" type="date" id="startDate" aria-label="Start date" style="width:auto">
  <button class="btn primary" id="plan">Plan trip</button>
</div>
<div class="split">
  <div id="map" class="map" aria-label="Map"></div>
  <aside class="panel">
    <div class="row between"><h2 id="title" style="margin:0"></h2><div class="row"><button class="btn sm" id="opt" title="Reorder each day's stops to minimize travel (nearest neighbour + 2-opt)">Optimize routes</button></div></div>
    <div class="kpis" id="tiles" style="margin-top:12px"></div>
    <div class="tabs" id="dayTabs" style="margin-top:12px"></div>
    <div id="dayView"></div>
    <form class="row" id="addStop" style="margin-top:8px"><input class="input grow" id="newStop" placeholder="Add a place to this day, e.g. LX Factory" aria-label="New stop"><button class="btn sm" type="submit">Add</button></form>
    <div class="card" style="margin-top:12px"><h3>Budget estimate</h3><div id="budgetView"></div></div>
    <div class="card" style="margin-top:12px"><h3>Tips</h3><ul id="tips" class="small"></ul></div>
    <div class="row" style="margin-top:12px"><button class="btn sm ghost" id="gpx">GPX (all days)</button><button class="btn sm ghost" id="ics">Calendar (.ics)</button><button class="btn sm ghost" id="mdx">Markdown</button></div>
  </aside>
</div>
</div>
<div class="page" data-page="expenses" data-title="Expenses">
<main class="stack">
  <div class="grid cols-2">
    <form class="card stack" id="expForm">
      <h2 style="margin:0">Log an expense</h2>
      <div class="grid cols-2"><label>What<input class="input" id="eWhat" placeholder="Dinner at Time Out" required></label><label>Category<select id="eCat"><option>food</option><option>sight</option><option>transport</option><option>lodging</option><option>shopping</option><option>nightlife</option><option>other</option></select></label></div>
      <div class="grid cols-3"><label>Amount<input class="input" type="number" step="0.01" min="0" id="eAmt" required></label><label>Currency<input class="input mono" id="eCur" value="EUR" maxlength="3"></label><label>Paid by<select id="ePaid"></select></label></div>
      <div><span class="small muted">Split between</span><div id="eSplit" class="row"></div></div>
      <button class="btn primary" type="submit">Add expense</button>
    </form>
    <div class="card stack">
      <h2 style="margin:0">Travellers and rates</h2>
      <label>Travellers <span class="small muted">(comma-separated)</span><input class="input" id="people"></label>
      <div class="grid cols-2"><label>Home currency<input class="input mono" id="home" maxlength="3"></label><label>Rates <span class="small muted">(units per 1 home)</span><input class="input mono" id="rates" placeholder="EUR=0.92, GBP=0.79"></label></div>
      <h3 style="margin:6px 0 0">Settle up</h3><div id="settle" class="small"></div>
    </div>
  </div>
  <div class="grid cols-2">
    <div class="card"><h2>Planned vs spent</h2><div id="vsBudget"></div></div>
    <div class="card"><h2>Balances</h2><div id="balances"></div></div>
  </div>
  <div class="card table-wrap"><table id="expTable"></table></div>
</main>
</div>

<div class="page" data-page="packing" data-title="Packing">
<main class="grid side">
  <aside class="card stack">
    <h2 style="margin:0">Trip details</h2>
    <label>Days<input class="input" type="number" id="pDays" min="1" max="60"></label>
    <label>Weather<select id="pClimate"><option value="mild">Mild</option><option value="hot">Hot</option><option value="cold">Cold</option><option value="rainy">Rainy</option></select></label>
    <div class="stack small" id="pActs"></div>
    <label class="chk"><input type="checkbox" id="pLaundry"> Can do laundry</label>
    <label class="chk"><input type="checkbox" id="pIntl" checked> International</label>
    <button class="btn primary" id="pMake">Build list</button>
    <button class="btn ghost" id="pAi">Add destination-specific items</button>
  </aside>
  <section class="card"><div class="row between"><h2 style="margin:0">Packing list</h2><div class="row"><span class="small muted" id="pCount"></span><button class="btn sm ghost" id="pCopy">Copy</button></div></div><div id="pList" class="pack"></div></section>
</main>
</div>

<div class="page" data-page="trips" data-title="Trips">
<main class="stack">
  <div class="page-head"><div><h2>Saved trips</h2><p id="tripSummary"></p></div><label class="btn ghost">Import JSON<input type="file" id="tripImport" accept=".json" hidden></label></div>
  <div class="grid cols-3" id="tripList"></div>
</main>
</div>

<div class="page" data-page="settings" data-title="Settings"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="src/lib/dom.js"></script>
<script src="src/lib/ai.js"></script>
<script src="src/lib/router.js"></script>
<script src="src/lib/copilot.js"></script>
<script src="src/core.js"></script>
<script src="src/demo.js"></script>
<script src="src/app.js"></script>
</body>
</html>
